name: Temporary Visual Audit

on:
  push:
    branches:
      - chore/deploy-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          mkdir -p .playwright-mcp
          npm run start > /tmp/gandra-next.log 2>&1 &
          echo $! > /tmp/gandra-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gandra-next.log
          exit 1

      - name: Capture audit screenshots
        run: node scripts-final-audit.cjs

      - name: Capture section screenshots
        run: node scripts-shot-sections.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gandra-visual-audit
          path: .playwright-mcp/*.png
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: true

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gandra-server-log
          path: /tmp/gandra-next.log
          if-no-files-found: ignore
          retention-days: 1
