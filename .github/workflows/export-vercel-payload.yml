name: Temporary Live Visual Audit

on:
  push:
    branches:
      - chore/deploy-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live visual audit
        run: |
          cat > /tmp/live-audit.cjs <<'NODE'
          const { chromium } = require('playwright')
          const fs = require('fs')
          const path = require('path')

          ;(async () => {
            const out = '.visual-live'
            fs.mkdirSync(out, { recursive: true })
            const base = 'https://gandra-tech.vercel.app'
            const browser = await chromium.launch()
            const issues = []

            async function openPage(context, route, label, settle = 4500) {
              const page = await context.newPage()
              page.on('console', msg => {
                if (msg.type() === 'error') issues.push({ label, type: 'console', text: msg.text() })
              })
              page.on('pageerror', err => issues.push({ label, type: 'pageerror', text: err.message }))
              page.on('requestfailed', req => issues.push({ label, type: 'requestfailed', text: `${req.method()} ${req.url()} :: ${req.failure()?.errorText || ''}` }))
              page.on('response', res => {
                if (res.status() >= 400) issues.push({ label, type: 'http', text: `${res.status()} ${res.url()}` })
              })
              await page.goto(base + route, { waitUntil: 'networkidle', timeout: 60000 })
              await page.waitForTimeout(settle)
              const metrics = await page.evaluate(() => ({
                innerWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                clientWidth: document.documentElement.clientWidth,
                scrollHeight: document.documentElement.scrollHeight,
              }))
              if (metrics.scrollWidth > metrics.clientWidth + 2) {
                issues.push({ label, type: 'horizontal-overflow', text: JSON.stringify(metrics) })
              }
              return page
            }

            async function snapViewport(page, file) {
              await page.screenshot({ path: path.join(out, file), animations: 'allow' })
            }

            async function snapSection(page, selector, file, settle = 2500) {
              const loc = page.locator(selector).first()
              await loc.scrollIntoViewIfNeeded()
              await page.waitForTimeout(settle)
              await snapViewport(page, file)
            }

            const viewports = [
              { name: 'desktop', width: 1440, height: 900 },
              { name: 'tablet', width: 768, height: 1024 },
              { name: 'mobile', width: 390, height: 844 },
            ]

            for (const v of viewports) {
              const context = await browser.newContext({
                viewport: { width: v.width, height: v.height },
                hasTouch: v.name !== 'desktop',
                isMobile: v.name === 'mobile',
              })
              const home = await openPage(context, '/', `${v.name}:home`)
              await snapViewport(home, `${v.name}-home-hero.png`)
              await snapSection(home, '.featured', `${v.name}-home-featured.png`)
              if (v.name !== 'tablet') {
                await snapSection(home, '.manifesto', `${v.name}-home-manifesto.png`)
                await snapSection(home, '.contact', `${v.name}-home-contact.png`)
              }
              await home.close()

              const trabalhos = await openPage(context, '/trabalhos', `${v.name}:trabalhos`, 3500)
              await snapViewport(trabalhos, `${v.name}-trabalhos-top.png`)
              if (v.name !== 'tablet') {
                await trabalhos.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight * 0.55))
                await trabalhos.waitForTimeout(1800)
                await snapViewport(trabalhos, `${v.name}-trabalhos-mid.png`)
              }
              await trabalhos.close()

              const contato = await openPage(context, '/contato', `${v.name}:contato`, 3500)
              await snapViewport(contato, `${v.name}-contato.png`)
              await contato.close()

              const sgs = await openPage(context, '/trabalhos/sgs', `${v.name}:sgs`, 3500)
              await snapViewport(sgs, `${v.name}-sgs-top.png`)
              if (v.name !== 'tablet') {
                await sgs.evaluate(() => window.scrollTo(0, Math.min(document.documentElement.scrollHeight * 0.42, 2200)))
                await sgs.waitForTimeout(1800)
                await snapViewport(sgs, `${v.name}-sgs-mid.png`)
              }
              await sgs.close()
              await context.close()
            }

            fs.writeFileSync(path.join(out, 'audit.json'), JSON.stringify({ base, issues }, null, 2))
            console.log(`audit issues captured: ${issues.length}`)
            await browser.close()
          })().catch(err => { console.error(err); process.exit(1) })
          NODE
          node /tmp/live-audit.cjs

      - name: Upload live audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gandra-live-visual-audit
          path: .visual-live/*
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
