name: One-time Dependency Remediation

on:
  push:
    branches: [security/dependency-remediation]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/dependency-remediation

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Validate build
        run: npm run build

      - name: Enforce high severity gate
        run: npm audit --audit-level=high

      - name: Remove one-time workflow and commit lockfile changes
        run: |
          rm .github/workflows/dependency-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): remediate vulnerable dependencies"
          git push origin HEAD:security/dependency-remediation
