name: Production Security Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: production-security-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-security:
    name: production-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Validate production surface
        env:
          PRODUCTION_URL: https://gandra.tech
        run: node scripts/check-production.mjs
