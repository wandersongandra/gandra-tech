name: Mobile Visual Audit

on:
  push:
    branches:
      - feat/mobile-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/gandra-mobile.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/gandra-mobile.log
          exit 1

      - name: Audit smartphones
        run: |
          cat > scripts-mobile-audit-temp.cjs <<'NODE'
          const { chromium } = require('playwright')
          const fs = require('fs')
          const path = require('path')

          ;(async () => {
            const out = '.mobile-audit'
            fs.mkdirSync(out, { recursive: true })
            const browser = await chromium.launch()
            const issues = []
            const metrics = []
            const widths = [320, 375, 390, 430]

            async function inspect(page, label) {
              const data = await page.evaluate(() => {
                const doc = document.documentElement
                const header = document.querySelector('.site-header')
                const logo = document.querySelector('.site-header__logo')
                const nav = document.querySelector('.site-header__nav')
                const curtain = document.querySelector('.curtain')
                const rect = (el) => el ? el.getBoundingClientRect() : null
                const visibleTargets = Array.from(document.querySelectorAll('a, button'))
                  .map((el) => ({
                    text: (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 50),
                    width: Math.round(el.getBoundingClientRect().width),
                    height: Math.round(el.getBoundingClientRect().height),
                    visible: !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length),
                  }))
                  .filter((item) => item.visible)
                return {
                  viewport: window.innerWidth,
                  scrollWidth: doc.scrollWidth,
                  clientWidth: doc.clientWidth,
                  scrollHeight: doc.scrollHeight,
                  header: rect(header),
                  logo: rect(logo),
                  nav: rect(nav),
                  curtain: rect(curtain),
                  curtainTransform: curtain ? getComputedStyle(curtain).transform : null,
                  targets: visibleTargets,
                }
              })

              metrics.push({ label, ...data })
              if (data.scrollWidth > data.clientWidth + 1) {
                issues.push({ label, type: 'horizontal-overflow', data })
              }
              if (data.logo && data.nav && data.logo.right > data.nav.left - 6) {
                issues.push({ label, type: 'header-collision', logo: data.logo, nav: data.nav })
              }
              return data
            }

            for (const width of widths) {
              const context = await browser.newContext({
                viewport: { width, height: 844 },
                isMobile: true,
                hasTouch: true,
                deviceScaleFactor: 1,
              })
              const page = await context.newPage()
              page.on('console', (msg) => {
                if (msg.type() === 'error') issues.push({ label: `${width}:home`, type: 'console', text: msg.text() })
              })
              page.on('pageerror', (err) => issues.push({ label: `${width}:home`, type: 'pageerror', text: err.message }))
              page.on('requestfailed', (req) => issues.push({ label: `${width}:home`, type: 'requestfailed', text: `${req.method()} ${req.url()} ${req.failure()?.errorText || ''}` }))

              await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' })
              await page.waitForTimeout(1800)
              await inspect(page, `${width}:home`)
              await page.screenshot({ path: path.join(out, `${width}-home-hero.png`) })

              if (width === 390) {
                await page.screenshot({ path: path.join(out, '390-home-full.png'), fullPage: true })

                for (const [route, name] of [
                  ['/trabalhos', 'trabalhos'],
                  ['/contato', 'contato'],
                  ['/trabalhos/sgs', 'sgs'],
                ]) {
                  await page.goto(`http://127.0.0.1:3000${route}`, { waitUntil: 'networkidle' })
                  await page.waitForTimeout(1200)
                  await inspect(page, `390:${name}`)
                  await page.screenshot({ path: path.join(out, `390-${name}-full.png`), fullPage: true })
                }
              }

              await context.close()
            }

            fs.writeFileSync(path.join(out, 'audit.json'), JSON.stringify({ issues, metrics }, null, 2))
            console.log(`mobile audit issues: ${issues.length}`)
            if (issues.some((issue) => ['horizontal-overflow', 'header-collision', 'pageerror'].includes(issue.type))) {
              process.exitCode = 1
            }
            await browser.close()
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE
          node scripts-mobile-audit-temp.cjs

      - name: Upload mobile audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gandra-mobile-audit
          path: .mobile-audit/*
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
