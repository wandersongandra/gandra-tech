<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gandra Tech — conexão indisponível</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
        --black: #000000;
        --paper: #f5f4f1;
        --ink: #111111;
        --muted: #5f5b55;
        --accent: #8f97dd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: calc(32px + env(safe-area-inset-top, 0px))
          calc(24px + env(safe-area-inset-right, 0px))
          calc(32px + env(safe-area-inset-bottom, 0px))
          calc(24px + env(safe-area-inset-left, 0px));
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 560px);
        border-top: 1px solid rgba(17, 17, 17, 0.14);
        padding-top: 28px;
      }

      .brand {
        margin-bottom: 48px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 18px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(40px, 12vw, 72px);
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 44rem;
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      a.retry {
        min-width: 44px;
        min-height: 44px;
        margin-top: 18px;
        padding: 12px 18px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
        font: inherit;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      a.retry:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Gandra Tech</div>
      <h1>Você está offline.</h1>
      <p>
        Não foi possível buscar a versão mais recente do site agora. Tente novamente quando a
        conexão voltar.
      </p>
      <p>O email de contato volta a funcionar normalmente assim que houver conexão.</p>
      <a class="retry" href="/">Tentar novamente</a>
    </main>
  </body>
</html>
